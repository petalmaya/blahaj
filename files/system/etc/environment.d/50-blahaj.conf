# Needed for xdg-desktop-portal to reliably pick the backends pinned in
# /etc/xdg/xdg-desktop-portal/niri-portals.conf. Without this it falls
# back to whatever "current desktop" niri itself reports (unset, in
# niri's case), so the portals.conf file above wouldn't match anything.
XDG_CURRENT_DESKTOP=niri
