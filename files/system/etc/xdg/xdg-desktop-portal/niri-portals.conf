# Without XDG_CURRENT_DESKTOP=niri (set in /etc/environment) plus this
# file, xdg-desktop-portal picks a backend per-interface more or less
# arbitrarily between the gnome and gtk backends installed here - which
# one answers a given screenshot/screencast/filechooser request isn't
# guaranteed to be consistent. Pin it explicitly instead:
#   - gnome backend: ScreenCast/Screenshot (niri's recommended backend
#     for these, per niri's own portal docs)
#   - gtk backend: FileChooser, Settings (better native GTK dialogs)
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
