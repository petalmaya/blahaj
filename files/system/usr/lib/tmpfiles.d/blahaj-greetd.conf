# /var is not populated from the build image on ostree systems - it's
# reset and rebuilt at every boot from systemd-tmpfiles.d rules like
# this one. A `type: script` module writing to /var/lib/greetd (or a
# `files` module shipping content under files/system/var/...) looks
# like it works during the build but never survives into an actual
# deployment. This is why greetd kept failing to chdir into its home
# and why the greeter's wallpaper never showed up: both were being
# written to /var at build time instead of declared here.
#
# Type Path              Mode UID     GID     Age Argument/Target
d      /var/lib/greetd     0750 greeter greeter -
d      /var/lib/greetd/.config 0750 greeter greeter -
L      /var/lib/greetd/.config/background - - - - /usr/share/backgrounds/blahaj/lain-server-room.jpg
