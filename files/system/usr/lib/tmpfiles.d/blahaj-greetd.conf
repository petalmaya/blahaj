# /var is not populated from the build image on ostree systems - it's
# reset and rebuilt at every boot from systemd-tmpfiles.d rules like
# this one. A `type: script` module writing to /var/lib/greetd (or a
# `files` module shipping content under files/system/var/...) looks
# like it works during the build but never survives into an actual
# deployment. This is why greetd kept failing to chdir into its home
# and why the greeter's wallpaper never showed up: both were being
# written to /var at build time instead of declared here.
#
# Type Path              Mode UID     GID     Age Argument/Target
d      /var/lib/greetd     0750 greeter greeter -
d      /var/lib/greetd/.config 0750 greeter greeter -
d      /var/lib/greetd/.config/kurukurubar 0750 greeter greeter -
# L (not L+) only creates the symlink if nothing already exists at that
# path - safe to leave as-is, already confirmed correct on disk.
L      /var/lib/greetd/.config/background - - - - /usr/share/backgrounds/blahaj/lain-server-room.jpg
#
# The wallpaper not showing was never actually the symlink (confirmed
# fine above) - it's that Config.qml's JsonAdapter only ever writes its
# QML-side default (wallSrc: HOME + "/.config/background") the *first*
# time config.json is created. Any earlier boot before this tmpfiles
# file existed (or any interrupted/killed greeter session) could have
# already created that file with an empty/stale/wrong wallSrc baked in,
# and nothing after that will ever self-heal it - JsonAdapter loads
# whatever's on disk and never re-applies the QML default over an
# existing key. `f+` unconditionally truncates and rewrites this file's
# content on every boot, so the greeter's wallpaper config can no longer
# depend on whatever garbage a previous broken boot happened to leave
# behind. This also removes the "/var/lib/greetd/.config/background
# symlink" indirection for the greeter session specifically - wallSrc
# points straight at the real file on the read-only /usr tree, which is
# one less thing that can be wrong.
f+     /var/lib/greetd/.config/kurukurubar/config.json 0640 greeter greeter - {"matugenEnabled":true,"reservedShell":false,"setWallpaper":true,"wallFgLayer":false,"wallSrc":"/usr/share/backgrounds/blahaj/lain-server-room.jpg","wallpapersByOutput":{},"wallpaperDir":"/var/lib/greetd/Pictures/Wallpapers"}
