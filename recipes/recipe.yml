---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: blahaj
# description will be included in the image's metadata
description: My personal OS image - niri + quickshell (kurukurubar) instead of GNOME, brew + flatpak for apps.

# base-main ships no desktop environment at all, which is what we want
# here since niri/quickshell are standing in for GNOME entirely (unlike
# bluefin, which builds on top of silverblue-main and keeps GNOME).
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # --- compositor, shell, greeter, wallpaper, fonts -----------------------
  - type: dnf
    repos:
      copr:
        - yalter/niri
        - errornointernet/quickshell
        - atim/starship
    install:
      packages:
        - niri
        - quickshell
        - greetd
        - xwayland-satellite
        # --- Qt/quickshell runtime - qt6-qtwayland is the one that's
        # easy to forget and breaks quickshell outright without it ---
        - qt6-qtdeclarative
        - qt6-qtwayland
        - qt6-qt5compat
        - qt6-qtmultimedia
        - qt6-qtimageformats
        - qt6-qtsvg
        - qt6-qtvirtualkeyboard
        # --- portals, polkit, session plumbing a bare base-main lacks ---
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome # niri's recommended portal backend (screenshot/screencast)
        - xdg-desktop-portal-gtk # file chooser, etc.
        - xdg-user-dirs
        - polkit
        - mate-polkit # polkit auth agent - niri doesn't ship one itself
        - NetworkManager
        - network-manager-applet
        - pipewire
        - pipewire-pulseaudio
        - pipewire-alsa
        - wireplumber
        - seatd
        - kgx # terminal emulator, bound to Mod+Return in the niri config below
        - brightnessctl
        - power-profiles-daemon
        - google-noto-sans-fonts
        - google-noto-emoji-fonts
        - pipx
        - micro
        - starship
        - unzip
    remove:
      packages:
        # base-main has no GNOME/firefox to begin with, but keep this
        # around as an example of the remove key in case a future base
        # image (or a swapped-in base) brings something you don't want.
        - firefox
        - firefox-langpacks

  - type: script
    scripts:
      - fonts.sh # Material Symbols / nerd Noto / librebarcode - not packaged in Fedora
      - rembg.sh # pipx install rembg, for the lock screen's fg-isolation effect

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  # --- greeter user ---------------------------------------------------
  # Fedora's greetd package already creates the `greeter` system user
  # itself via its own sysusers.d scriptlet (same mechanism seatd uses
  # for its `seat` group) - no useradd needed, and this base image has
  # no `video` group for one to join anyway.
  - type: script
    snippets:
      - chmod -R go+rX /usr/share/quickshell/kurukurubar
      - chown -R greeter:greeter /var/lib/greetd

  - type: systemd
    system:
      enabled:
        - greetd.service
        - NetworkManager.service
        - seatd.service
        - power-profiles-daemon.service
        # picked up from files/systemd/system/blahaj-brew-bundle.service
        # and copied into /usr/lib/systemd/system automatically by this
        # module - runs `brew bundle` against the Brewfile below, once,
        # the first time the system boots after brew-setup.service has
        # actually unpacked Homebrew
        - blahaj-brew-bundle.service

  # --- brew, front and center for CLI tooling -----------------------------
  # The brew module only installs Homebrew itself (tarball at build time,
  # unpacked to /home/linuxbrew on first boot) - it has no `install:` list.
  # Actual packages get pulled in by `brew bundle` against the Brewfile
  # below, via the blahaj-brew-bundle.service unit (enabled below).
  - type: brew
    nofile-limits: true

  # --- flatpak, front and center for GUI apps -----------------------------
  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.gnome.TextEditor
          - org.gnome.Papers
          - io.github.flattool.Warehouse
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
